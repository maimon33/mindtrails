name: Deploy Demo to S3 & Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "demo/**"
      - ".github/workflows/deploy-demo.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::236565801201:role/maimons-infra-github-ssm
          aws-region: eu-central-1

      - name: Sync demo to S3
        run: |
          aws s3 sync demo/ s3://mindtrails/ --delete --region eu-central-1
          echo "✅ Demo files synced to S3"

      - name: Purge Cloudflare cache
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
          echo "✅ Cloudflare cache purged"

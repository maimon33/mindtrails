name: Deploy with Terraform

on:
  push:
    branches:
      - main
    paths:
      - 'lambda/**'
      - 'terraform/**'
      - '.github/workflows/deploy-terraform.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.6.0

jobs:
  validate:
    name: Validate & Plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      tf_plan: ${{ steps.plan.outputs.stdout }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::236565801201:role/maimons-infra-github-ssm
          aws-region: ${{ env.AWS_REGION }}

      - name: Package Lambda function
        run: |
          cd lambda
          zip -r ../lambda.zip .
          cd ..
          echo "✅ Lambda function packaged"

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: ./terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ./terraform
        run: |
          terraform plan \
            -var="admin_email=${{ secrets.MINDTRAILS_ADMIN_EMAIL }}" \
            -var="noreply_email=${{ secrets.MINDTRAILS_NOREPLY_EMAIL }}" \
            -var="allowed_origin=${{ secrets.MINDTRAILS_DOMAIN_URL }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -out=tfplan

          # Save plan for next job
          terraform show -json tfplan > tfplan.json
        env:
          TF_INPUT: false

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan.json
          retention-days: 1

  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      id-token: write
      contents: read
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::236565801201:role/maimons-infra-github-ssm
          aws-region: ${{ env.AWS_REGION }}

      - name: Package Lambda function
        run: |
          cd lambda
          zip -r ../lambda.zip .
          cd ..
          echo "✅ Lambda function packaged"

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: ./terraform
        run: |
          terraform apply \
            -var="admin_email=${{ secrets.MINDTRAILS_ADMIN_EMAIL }}" \
            -var="noreply_email=${{ secrets.MINDTRAILS_NOREPLY_EMAIL }}" \
            -var="allowed_origin=${{ secrets.MINDTRAILS_DOMAIN_URL }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -auto-approve
        env:
          TF_INPUT: false

      - name: Get API Endpoint
        id: endpoint
        working-directory: ./terraform
        run: |
          ENDPOINT=$(terraform output -raw api_endpoint)
          echo "api_endpoint=$ENDPOINT" >> $GITHUB_OUTPUT
          echo "✅ API Endpoint: $ENDPOINT"

      - name: Output Deployment Info
        run: |
          echo "✅ Infrastructure deployed with Terraform"
          echo ""
          echo "📍 API Endpoint: ${{ steps.endpoint.outputs.api_endpoint }}"
          echo ""
          echo "Next step: Update form action in content/index.html"
          echo "Form action should be: ${{ steps.endpoint.outputs.api_endpoint }}"

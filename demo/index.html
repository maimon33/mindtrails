                                            <button class="w-full py-4 rounded-lg bg-primary text-on-primary font-headline-sm text-headline-sm shadow-xl hover:scale-[1.01] active:scale-[0.99] transition-all flex items-center justify-center gap-space-sm" type="submit">
                                                <span>Request Custom Proposal</span>
                                                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
                                            </button>

                                            {completed && (
                                                <div class="p-6 rounded-xl bg-surface-container-highest text-center">
                                                    <span class="material-symbols-outlined text-[36px] text-primary">check_circle</span>
                                                    <h4 class="font-headline-md text-headline-md text-on-surface mt-2">Adventure Transmission Received!</h4>
                                                    <p class="font-body-md text-body-md text-on-surface-variant mt-1">Our Game Master Daniel will contact you within 24 hours.</p>
                                                </div>
                                            )}
                                        </form>
                                    </div>
                                </div>

                                {/* Right: Direct Dispatch Hotline & FAQ */}
                                <div class="lg:col-span-4 flex flex-col gap-gutter">
                                    <div class="bg-surface-container p-6 sm:p-8 rounded-xl shadow-xl flex flex-col gap-6">
                                        <h3 class="font-headline-md text-headline-md text-on-surface leading-tight">Need Answers in 15 Minutes?</h3>
                                        <div class="flex flex-col gap-space-sm">
                                            <a class="flex items-center justify-between p-4 rounded-lg bg-surface-container-high hover:bg-surface-bright text-on-surface transition-all" href="tel:538203896">
                                                <div class="flex items-center gap-space-sm">
                                                    <span class="material-symbols-outlined text-primary text-[24px]">call</span>
                                                    <div class="flex flex-col">
                                                        <span class="font-label-md text-label-md font-bold">538-203-896</span>
                                                        <span class="font-body-sm text-body-sm text-on-surface-variant">Voice direct hotline</span>
                                                    </div>
                                                </div>
                                                <span class="material-symbols-outlined text-[20px]">arrow_outward</span>
                                            </a>
                                        </div>
                                    </div>

                                    {/* FAQ Accordion */}
                                    <div class="bg-surface-container p-6 sm:p-8 rounded-xl shadow-xl flex flex-col gap-6">
                                        <h3 class="font-headline-sm text-headline-sm text-on-surface">Frequently Asked</h3>
                                        <div class="flex flex-col gap-space-sm">
                                            {faqs.map((f) => (
                                                <div key={f.id} class="bg-surface-container-low rounded-lg overflow-hidden">
                                                    <button
                                                        type="button"
                                                        onClick={() => setFaqOpen(faqOpen === f.id ? null : f.id)}
                                                        class="w-full p-4 text-left flex items-center justify-between gap-space-sm text-on-surface"
                                                    >
                                                        <span class="font-label-md text-label-md font-semibold">{f.q}</span>
                                                        <span class={`material-symbols-outlined text-[18px] transition-transform ${faqOpen === f.id ? "rotate-180 text-primary" : ""}`}>
                                                            expand_more
                                                        </span>
                                                    </button>
                                                    {faqOpen === f.id && (
                                                        <div class="px-4 pb-4 font-body-sm text-body-sm text-on-surface-variant">
                                                            {f.a}
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Main App Container with Router & Route Switching
        function App() {
            return (
                <div class="min-h-screen bg-surface flex flex-col">
                    <NavigationHeader />
                    <main class="w-full pt-20 bg-surface flex-grow">
                        <Routes>
                            <Route path="/" element={<HomeScreen />} />
                            <Route path="/corporate" element={<CorporateScreen />} />
                            <Route path="/pub-quizzes" element={<PubQuizzesScreen />} />
                            <Route path="/storytelling" element={<StorytellingScreen />} />
                            <Route path="/booking" element={<BookingInquiryScreen />} />
                            <Route path="*" element={<HomeScreen />} />
                        </Routes>
                    </main>
                    <Footer />
                </div>
            );
        }

        // Top-Level MemoryRouter Mount
        const root = createRoot(document.getElementById("root"));
        root.render(
            <MemoryRouter initialEntries={["/"]}>
                <App />
            </MemoryRouter>
        );
    </script>
</body>

</html>
